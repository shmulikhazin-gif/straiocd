<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מדד שבירות פולאריות גלובלי | STRAIOCD Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #060913;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-border: rgba(56, 189, 248, 0.2);
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-violet: #8b5cf6;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Assistant', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(6, 9, 19, 0.88);
      border-bottom: 1px solid var(--bg-card-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #google_translate_element {
      display: inline-block;
    }
    .goog-te-combo {
      background-color: rgba(15, 23, 42, 0.9) !important;
      color: var(--accent-cyan) !important;
      border: 1px solid var(--accent-cyan) !important;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .goog-te-gadget span, .goog-logo-link {
      display: none !important;
    }
    div.goog-te-gadget {
      color: transparent !important;
    }

    main {
      max-width: 1350px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet), var(--accent-amber));
    }

    .hero-title {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      max-width: 1000px;
    }

    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      color: var(--accent-cyan);
    }

    .basin-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--bg-card-border);
    }

    .basin-btn {
      flex: 1;
      min-width: 140px;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      text-align: center;
    }

    .basin-btn:hover {
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .basin-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--bg-card-border);
      padding: 1.25rem;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.6rem;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 14px;
      padding: 1.75rem;
      backdrop-filter: blur(12px);
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
    }

    .chart-container {
      position: relative;
      height: 420px;
      width: 100%;
    }

    footer {
      margin-top: 3rem;
      background: rgba(3, 6, 13, 0.95);
      border-top: 1px solid var(--bg-card-border);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .credit-box {

      margin: 0 auto;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(56, 189
